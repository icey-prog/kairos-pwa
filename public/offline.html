<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors ligne — Neuro-Kaizen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: #111111;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: #f7f7f5;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 28px;
    }
    h1 {
      font-size: 1.375rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.9375rem;
      color: #8e8e93;
      line-height: 1.5;
      max-width: 280px;
    }
    button {
      margin-top: 2rem;
      padding: 0.75rem 1.5rem;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { opacity: 0.8; transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Pas de connexion</h1>
  <p>Vérifie ton réseau et réessaie. Tes données locales sont conservées.</p>
  <button onclick="window.location.reload()">Réessayer</button>
</body>
</html>
