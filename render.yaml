services:
  - type: web
    name: neuro-kaizen-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    disk:
      name: neuro-kaizen-db
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_DIR
        value: /data
      - key: FRONTEND_URL
        sync: false  # à remplir manuellement dans le dashboard Render
